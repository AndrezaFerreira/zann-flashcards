    >

<body>

    <main class="app">

        <section class="home">

            <div class="home-hero">

                <div class="home-brand">

                    <div class="home-logo">
                        Z
                    </div>

                    <div>

                        <p class="home-eyebrow">
                            English study
                        </p>

                        <h1>
                            ZWords
                        </h1>

                        <p class="home-subtitle">
                            Build your vocabulary with words,
                            phrases and irregular verbs.
                        </p>

                    </div>

                </div>

            </div>


            <section class="offline-test">

                <button
                    id="offlineTestButton"
                    type="button"
                >
                    Download Everything
                </button>

                <div
                    id="offlineTestStatus"
                    class="offline-test-status"
                >
                    Ready for offline installation
                </div>

                <div class="offline-test-progress">

                    <div
                        id="offlineTestProgressBar"
                        class="offline-test-progress-bar"
                    ></div>

                </div>

            </section>


            <section class="collections">

                <button
                    class="collection collection-words"
                    id="words"
                    type="button"
                >

                    <span class="collection-icon">
                        📚
                    </span>


                    <span class="collection-content">

                        <span class="collection-top">

                            <span class="collection-title">
                                WORDS
                            </span>

                            <span class="collection-arrow">
                                ›
                            </span>

                        </span>


                        <span class="collection-count">
                            75,667 cards
                        </span>


                        <span class="collection-description">
                            Vocabulary, meanings, pronunciation
                            and examples.
                        </span>

                    </span>

                </button>


                <button
                    class="collection collection-phrases"
                    id="phrases"
                    type="button"
                >

                    <span class="collection-icon">
                        💬
                    </span>


                    <span class="collection-content">

                        <span class="collection-top">

                            <span class="collection-title">
                                PHRASES
                            </span>

                            <span class="collection-arrow">
                                ›
                            </span>

                        </span>


                        <span class="collection-count">
                            16,575 cards
                        </span>


                        <span class="collection-description">
                            Expressions, idioms and everyday
                            phrases in context.
                        </span>

                    </span>

                </button>


                <button
                    class="collection collection-irregulars"
                    id="irregulars"
                    type="button"
                >

                    <span class="collection-icon">
                        🔄
                    </span>


                    <span class="collection-content">

                        <span class="collection-top">

                            <span class="collection-title">
                                IRREGULAR VERBS
                            </span>

                            <span class="collection-arrow">
                                ›
                            </span>

                        </span>


                        <span class="collection-count">
                            929 cards
                        </span>


                        <span class="collection-description">
                            Past simple, past participle,
                            meanings and examples.
                        </span>

                    </span>

                </button>

            </section>

        </section>

    </main>


    <script src="libs/fflate.min.js"></script>

    <script src="app.js?v=20260913-8"></script>


    <script>
        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator.serviceWorker.register(
                                "./service-worker.js?v=20260913-3"
                            );

                        console.log(
                            "Service Worker registered:",
                            registration.scope
                        );


                        if (
                            registration.waiting
                        ) {

                            registration.waiting.postMessage({
                                type:
                                    "SKIP_WAITING"
                            });

                        }


                        registration.addEventListener(
                            "updatefound",
                            () => {

                                const worker =
                                    registration.installing;


                                if (
                                    !worker
                                ) {
                                    return;
                                }


                                worker.addEventListener(
                                    "statechange",
                                    () => {

                                        if (
                                            worker.state ===
                                            "installed"
                                            &&
                                            navigator.serviceWorker.controller
                                        ) {

                                            console.log(
                                                "New Service Worker installed."
                                            );

                                        }

                                    }
                                );

                            }
                        );


                    } catch (
                        error
                    ) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    }

                }
            );


            navigator.serviceWorker.addEventListener(
                "controllerchange",
                () => {

                    console.log(
                        "Service Worker controller changed."
                    );

                }
            );

        }
    </script>

</body>

</html>
